<div [ngStyle]="{display: 'grid', gap: '5px'}">
    <span class="address-title">Busca de Endereços</span>
    <app-search-data placeholder="Buscar por CEP:" (search)="onSearch($event)"></app-search-data>
    <app-list-data [list_address]="address$ | async" (delete)="onDelete($event)"></app-list-data>
</div>
