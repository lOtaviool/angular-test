<div class="table-container">

    <table mat-table *ngIf="list_address?.length != 0" [dataSource]="list_address || []">

        <ng-container matColumnDef="cep">
            <th mat-header-cell *matHeaderCellDef>CEP</th>

            <td mat-cell *matCellDef="let address">
            {{ address.cep }}
            </td>
        </ng-container>

        <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef>Endereço</th>

            <td mat-cell *matCellDef="let address">
                <div class="address-cell">
                    <strong>{{ address.logradouro }}</strong>

                    <span>
                        {{ address.bairro }} - {{ address.localidade }}/{{ address.uf }}
                    </span>
                </div>
            </td>
        </ng-container>

        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Data</th>

            <td mat-cell *matCellDef="let address">
                {{ address?.date || '-' }}
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>

            <td mat-cell *matCellDef="let address">
                <button
                    mat-icon-button
                    type="button"
                    aria-label="Remover endereço">

                    <mat-icon>delete</mat-icon>

                </button>
            </td>
        </ng-container>

        <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns">
        </tr>

        <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns">
        </tr>

    </table>

    <div class="empty-state" *ngIf="list_address?.length === 0">

        <mat-icon>location_on</mat-icon>

        <p>Nenhum endereço pesquisado.</p>

    </div>

</div>
